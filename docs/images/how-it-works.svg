<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="330" rx="12"/>

  <!-- the repositories -->
  <rect class="box" x="24" y="70" width="180" height="140" rx="10" stroke-width="1.2"/>
  <text class="code" x="114" y="100" text-anchor="middle">~/workspace</text>
  <text class="title" x="114" y="124" text-anchor="middle">Your repositories</text>
  <text class="text" x="114" y="146" text-anchor="middle">one development across</text>
  <text class="text" x="114" y="163" text-anchor="middle">many of them, each on</text>
  <text class="text" x="114" y="180" text-anchor="middle">its branch</text>

  <!-- coddy -->
  <path class="arrow" d="M204,140 H256" marker-end="url(#arrow)"/>
  <text class="label" x="230" y="130" text-anchor="middle">git</text>
  <rect class="accent" x="260" y="24" width="360" height="282" rx="10" stroke-width="1.4"/>
  <text class="title" x="440" y="52" text-anchor="middle">Coddy</text>

  <rect class="box" x="278" y="68" width="324" height="60" rx="8" stroke-width="1.2"/>
  <text class="code" x="292" y="91">workspace · git</text>
  <text class="text" x="292" y="112">what changed since the branch left its base, read-only</text>

  <rect class="box" x="278" y="142" width="324" height="60" rx="8" stroke-width="1.2"/>
  <text class="code" x="292" y="165">files · review · uses</text>
  <text class="text" x="292" y="186">the modes: what the sidebar lists and the viewer shows</text>

  <rect class="box" x="278" y="216" width="324" height="70" rx="8" stroke-width="1.2"/>
  <text class="code" x="292" y="239">go-ui · go-renderer</text>
  <text class="text" x="292" y="260">the window, described again every frame</text>
  <text class="text" x="292" y="277">and drawn with Metal, only when something changes</text>

  <!-- language servers -->
  <path class="arrow" d="M620,172 H672" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="label" x="646" y="162" text-anchor="middle">LSP</text>
  <rect class="box" x="676" y="90" width="180" height="164" rx="10" stroke-width="1.2"/>
  <text class="title" x="766" y="118" text-anchor="middle">Language servers</text>
  <text class="code" x="766" y="144" text-anchor="middle">gopls · jdtls</text>
  <text class="code" x="766" y="162" text-anchor="middle">kotlin-lsp</text>
  <text class="text" x="766" y="188" text-anchor="middle">declarations, uses and</text>
  <text class="text" x="766" y="205" text-anchor="middle">hovers across every</text>
  <text class="text" x="766" y="222" text-anchor="middle">repository, started on</text>
  <text class="text" x="766" y="239" text-anchor="middle">first use</text>
</svg>
